# FM-1 Again's build settings (fm1-base tools/build.py)
board = "smk37"                # the M-VAVE SMK-37 (fm1-base smk37-inhouse)
model = "pro"
name = "AGAIN"                 # APP_NAME is in app.h; this names the build's files (again.fwsc)
id_prefix = "FM-1_242"         # package identity: dev FM-1_24200, releases FM-1_242XXYYZZ ("AGA" on a phone's keys; free
                                # in the hub's catalogue, 2026-11-25. 1.0 .. 1.0.2 were FM-1_13370XXYYZZ: too long for the hub)
usb_manufacturer = "PolarPatch"
usb_product = "FM-1 Again"
title = "FM-1 Again SMK-37"             # the name in firmware.json (else the manufacturer, PolarPatch)
o2 = []                        # separate units compiled at -O2 (the DSP)
words = "words.tsv"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI devices too
companion = true               # the settings and CHOP's sample as files over USB (tools/again_chop.py --send)
ble_stack = "own"              # fm1-base's own stack (Optimist, MPL-2.0): nothing of JieLi's linked (GPL modules may join)
wifi = true                    # Wi-Fi on fm1-base's own stack (Optimist's, MPL-2.0), on the own Bluetooth stack's radio
wifi_stack = "own"
wifi_ap = true                 # MODE AP: the FM-1 as its own access point (a phone with a Link app joins it on stage)
link = true                    # Ableton Link (base/link/: GPL-3.0-only, so the firmware as a whole is GPL-3.0-only)
midi_stamp = true             # MIDI in stamped where it lands: a MIDI clock followed to the frame
mirror = true                  # the screen and panel mirrored over USB (FM-1 Live's Screen room, fm1-base's web mirror)
backup = true                  # the settings backed up and restored over USB (and the resource region's transfer)
# resources = "media/again_saver.bin"   # the screensaver's film (tools/again_saver.py; the USB002 creative drop, not GPL)
# resources_what = "the screensaver's film"
# the site (base/tools/make_site.py, base/tools/publish_site.sh)
tagline = "warm, chopped, pumping: the FM-1 made again"
repo = "https://github.com/PolarPatch/FM-1-Again-SMK-37"
licence = "GPL-3.0-only"       # (link = true: GPL-3.0-only as a whole; my own files stay GPL-3.0-or-later)
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments); modules from Arctic Scream p0larpatch."
# firmware.json, for firmware hubs (base/docs/FIRMWARE-JSON.md)
author = "PolarPatch"
description = "Warm, emotional, rhythmic electronic music made again on the SMK-37: chopped and pitched voices and everyday sounds, soft piano chords, a sidechain pump, garage and house grooves, build-ups and drops."
tags = ["groovebox", "sampler", "chords"]
install = "https://github.com/PolarPatch/FM-1-Again-SMK-37/releases/latest"
site = "https://polarpatch.github.io/FM-1-Again/"
screenshot = "app/docs/img/screen-playing.png"
